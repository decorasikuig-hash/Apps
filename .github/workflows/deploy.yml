name: Deploy Website via FTP

on:
  push:
    branches:
      - main  # Atau ganti dengan nama branch utama Anda (misal 'master')

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-size: 18

    - name: 📦 Install Dependencies and Build
      run: |
        npm install
        npm run build

    - name: 🚀 Sync Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: apps/  # Folders hasil build React/Vite yang akan diunggah
        server-dir: public_html/apps  # Folder tujuan di hosting anda
